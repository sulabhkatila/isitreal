[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depcheck"
version = "0.1.0"
description = "Dependency reality-checker for AI coding agents to verify packages before installing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity", email = "antigravity@google.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
depcheck = "depcheck.cli:main"
depcheck-mcp = "depcheck.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["depcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
