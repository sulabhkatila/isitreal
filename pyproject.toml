[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopguard"
version = "0.1.0"
description = "Dependency reality-checker for AI coding agents to verify packages before installing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity", email = "antigravity@google.com" }
]
keywords = [
    "ai",
    "agent",
    "security",
    "dependencies",
    "slopsquatting",
    "hallucination",
    "mcp",
    "pypi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/example/slopguard"
Repository = "https://github.com/example/slopguard"
Issues = "https://github.com/example/slopguard/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
slopguard = "slopguard.cli:main"
slopguard-mcp = "slopguard.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["slopguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
